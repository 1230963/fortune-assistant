<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { overflow-x: hidden; overflow-y: auto; }
  /* 隐藏滚动条但保留滚动功能 */
  body::-webkit-scrollbar { display: none; }
  body { scrollbar-width: none; -ms-overflow-style: none; }
  body {
    width: 320px;
    background: #FBF5EA;
    color: #43302B;
    font-family: "PingFang SC", -apple-system, "Hiragino Sans GB", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  #app { padding-bottom: 8px; }

  .card {
    background: #FFFDF7;
    border: 1px solid #E7DAC2;
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(90, 60, 30, .06);
    margin: 7px 10px 0;
    padding: 9px 12px;
  }

  .sign-card { text-align: center; position: relative; }
  .level-badge {
    display: inline-block; background: #B8860B; color: #fff;
    font-size: 10px; font-weight: 700; padding: 2px 10px;
    border-radius: 999px; margin-bottom: 4px;
  }
  .level { color: #A87B0A; font-size: 15px; font-weight: 700; }
  .poem { margin-top: 4px; font-size: 13px; line-height: 1.7; white-space: pre-line; }
  .hint { margin-top: 3px; font-size: 9px; color: #8A7A6A; min-height: 10px; }

  .grid2 {
    display: grid;
    grid-template-columns: auto 1fr auto 1fr;
    gap: 4px 6px;
    align-items: center;
    font-size: 11.5px;
  }
  .k { color: #8A7A6A; text-align: right; }
  .star { color: #D9A441; font-size: 12.5px; letter-spacing: 1px; }

  .row { display: flex; align-items: center; padding: 2px 0; font-size: 11.5px; }
  .badge {
    flex: none; color: #fff; font-weight: 700; font-size: 11px;
    border-radius: 4px; padding: 2px 8px; margin-right: 8px;
  }
  .badge.yi { background: #2E7D32; }
  .badge.ji { background: #C62828; }

  /* 宜忌详细版：两列布局 */
  .yiji-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .yiji-col { display: flex; flex-direction: column; }
  .yiji-col + .yiji-col { border-left: 1px dashed #EDE2CC; padding-left: 10px; }
  .yiji-row { display: flex; align-items: flex-start; padding: 3px 0; }
  .yiji-detail { display: flex; flex-direction: column; margin-left: 8px; flex: 1; }
  .yiji-key { font-size: 11.5px; font-weight: 600; color: #43302B; }
  .yiji-why { font-size: 9px; color: #8A7A6A; line-height: 1.3; margin-top: 1px; }

  /* Windows 标题栏（默认隐藏，win=1 时显示） */
  #winHeader {
    display: none;
    height: 58px; background: #B03A2E; color: #FDEBD0;
    padding: 8px 14px 0; position: relative;
    -webkit-app-region: drag;
    border-radius: 14px 14px 0 0;
  }
  body.win #winHeader { display: block; }
  body.win { background: transparent; }
  body.win #app { background: #FBF5EA; border-radius: 0 0 14px 14px; }
  .wh-title { font-size: 14px; font-weight: 700; display: block; }
  .wh-date { font-size: 9px; color: #F0D5C5; display: block; margin-top: 2px; }
  .wh-btn {
    position: absolute; top: 8px; width: 26px; height: 24px;
    text-align: center; line-height: 24px; font-size: 13px; font-weight: 700;
    color: #F0D5C5; cursor: pointer; border-radius: 4px;
    -webkit-app-region: no-drag;
  }
  .wh-btn:hover { background: rgba(255,255,255,.15); color: #fff; }
  #whMin { right: 38px; }
  #whClose { right: 8px; }


  /* 答案之书 */
  .book-input-row { display: flex; gap: 5px; align-items: center; margin: 6px 0 4px; }
  .book-input-row input {
    flex: 1; background: #FFF9EE; border: 2px solid #B8860B; border-radius: 8px;
    padding: 6px 10px; font-family: inherit; font-size: 14px; font-weight: 600; text-align: center;
    color: #43302B; outline: none;
  }
  .book-input-row input::placeholder { color: #B0A48E; font-weight: 400; }
  .book-input-row input:focus { border-color: #B8860B; }
  .book-input-row button {
    padding: 5px 12px; font-size: 11px; min-width: 36px;
    border-radius: 6px;
  }
  .book-answer {
    text-align: center; padding: 10px 6px; font-size: 13px; line-height: 1.7;
    color: #43302B; min-height: 44px; display: flex; align-items: center; justify-content: center;
  }
  .book-page { text-align: center; font-size: 9px; color: #8A7A6A; margin-top: 2px; }
  .book-hint { text-align: center; font-size: 9px; color: #8A7A6A; margin-bottom: 4px; }
  /* 小球视图（body.minimized 时显示） */
  #ball { display: none; }
  body.minimized #app, body.minimized #winHeader { display: none !important; }
  body.minimized #ball { display: flex; }
  #ball {
    width: 64px; height: 64px; align-items: center; justify-content: center;
    cursor: pointer; -webkit-app-region: drag;
  }
  .ball-inner {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #D25241, #8C2218);
    border: 3px solid #E9C46A;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .ball-char { color: #F6D670; font-size: 26px; font-weight: 700; font-family: "STKaiti", "KaiTi", serif; }
  .ball-dot {
    position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    width: 8px; height: 8px; border-radius: 50%; background: #95A5A6;
  }

  /* 命盘隐藏/显示 */
  #showBazi:hover { color: #9A7209; }
  #baziDetail { margin-top: 6px; }

  .sec { color: #A87B0A; font-size: 11px; font-weight: 700; margin-bottom: 3px; }
  #meTitleRow { display: flex; justify-content: space-between; align-items: center; }
  #editInfo {
    font-size: 9px; font-weight: 400; color: #B0A48E; cursor: pointer;
    border: 1px solid #E0D4BE; border-radius: 999px; padding: 2px 8px;
  }
  #editInfo:hover { color: #A87B0A; border-color: #B8860B; }
  .sec .sub { color: #8A7A6A; font-weight: 400; }
  .bodytext { font-size: 11.5px; line-height: 1.6; }
  .bodytext + .bodytext { margin-top: 3px; }
  .warn { color: #C62828; }
  .gold { color: #A87B0A; }


  .wxbars { display: flex; justify-content: space-between; align-items: flex-end;
            margin: 6px 2px 4px; height: 46px; }
  .wxcol { display: flex; flex-direction: column; align-items: center; width: 40px; }
  .wxmark { font-size: 8px; color: #B8860B; height: 10px; }
  .wxbar { width: 20px; border-radius: 3px 3px 0 0; }
  .wxname { font-size: 10px; color: #8A7A6A; margin-top: 2px; }

  .dot {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.18); vertical-align: -1px; margin-right: 4px;
  }

  /* 两列评分网格 */
  .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin-top: 4px; }
  .score-col { display: flex; flex-direction: column; }
  .score-col + .score-col { border-left: 1px dashed #EDE2CC; padding-left: 10px; }
  .pctrow { display: flex; align-items: center; margin-top: 4px; font-size: 10.5px; }
  .pctrow .plabel { width: 34px; color: #8A7A6A; flex: none; }
  .pctrow .pbar { flex: 1; height: 6px; background: #F0E6D2; border-radius: 3px; overflow: hidden; }
  .pctrow .pfill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #D9A441, #B8860B); }
  .pctrow .pval { width: 30px; text-align: right; color: #A87B0A; font-weight: 700; flex: none; }

  .btns { display: flex; justify-content: space-between; margin: 9px 10px 0; }
  button {
    border: none; border-radius: 999px; padding: 6px 16px;
    font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  #reroll { background: #B8860B; color: #fff; }
  #reroll:hover { background: #9A7209; }
  .ghost { background: #F1E7D2; color: #43302B; }
  .ghost:hover { background: #E6D7BC; }

  .foot { text-align: center; font-size: 9px; color: #8A7A6A; margin-top: 7px; }

  .menu {
    position: fixed; z-index: 50; min-width: 168px;
    background: #FFFDF7; border: 1px solid #E0D4BE; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(60, 35, 15, .22);
    padding: 4px;
  }
  .mi {
    padding: 6px 12px; border-radius: 5px; font-size: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .mi:hover { background: #F4EBD9; }
  .sep { border-top: 1px solid #EDE2CC; margin: 4px 8px; }
  .check { color: #B8860B; font-weight: 700; }

  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(60, 40, 30, .28);
    display: flex; align-items: center; justify-content: center;
  }
  .panel {
    width: 268px; background: #FBF5EA; border: 1px solid #E0D4BE;
    border-radius: 12px; padding: 13px;
    box-shadow: 0 8px 24px rgba(60, 35, 15, .3);
  }
  .ptitle { font-size: 13px; font-weight: 700; color: #A87B0A; text-align: center; margin-bottom: 6px; }
  .plabel { font-size: 10px; color: #8A7A6A; margin: 8px 0 4px; }
  .signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .signs button {
    background: #FFFDF7; border: 1px solid #E0D4BE; border-radius: 6px;
    padding: 5px 0; font-size: 11.5px; font-weight: 400; color: #43302B;
  }
  .signs button:hover { border-color: #B8860B; color: #A87B0A; }
  .signs button.on { background: #B8860B; border-color: #B8860B; color: #fff; }
  .setrow { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
  .slabel { font-size: 10px; color: #8A7A6A; flex: none; }
  .sval {
    flex: 1; text-align: center; background: #FFFDF7; border: 1px solid #E0D4BE;
    border-radius: 6px; padding: 4px 0; font-size: 12px; min-width: 40px;
  }
  .setrow button { padding: 4px 9px; font-size: 10px; }
  .sselect {
    flex: 1; background: #FFFDF7; border: 1px solid #E0D4BE; border-radius: 6px;
    padding: 4px 6px; font-family: inherit; font-size: 12px; color: #43302B;
    min-width: 0; outline: none;
  }
  .sselect:focus { border-color: #B8860B; }
  .prow { display: flex; gap: 6px; margin-top: 12px; }
  .prow button { flex: 1; padding: 6px 0; font-size: 11px; }
  #meOk { background: #B8860B; color: #fff; }
  #meOk:hover { background: #9A7209; }
  .hairline { border-top: 1px solid #EDE2CC; margin: 7px 0 6px; }
  .grey { color: #8A7A6A; }

  /* 四柱表 */
  .pillars {
    display: flex; background: #FFF9EE; border: 1px solid #EDE2CC;
    border-radius: 8px; padding: 6px 0; margin: 6px 0;
  }
  .pcell { flex: 1; text-align: center; }
  .pcell + .pcell { border-left: 1px dashed #EDE2CC; }
  .ph { font-size: 9px; color: #8A7A6A; margin-bottom: 2px; }
  .pg { font-size: 16px; font-weight: 700; line-height: 1.35; }
  .pe { font-size: 9px; color: #A87A0A; }
  .pe { font-size: 9px; color: #A87B0A; }
</style>
</head>
<body>
<div id="winHeader">
  <span class="wh-title">🏮 每日运势</span>
  <span class="wh-date" id="whDate"></span>
  <span class="wh-btn" id="whMin">−</span>

</div>
<div id="ball"><div class="ball-inner"><span class="ball-char">吉</span><span class="ball-dot" id="ballDot"></span></div></div>
<div id="app">
  <div class="card sign-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span></span>
      <div class="level-badge" id="levelBadge"></div>
      <div style="display:flex;gap:3px;align-items:center">
        <input type="date" id="datePicker" style="font-size:10px;padding:2px 4px;border:1px solid #E0D4BE;border-radius:4px;background:#FFFDF7;color:#43302B;outline:none">
        <button class="ghost" id="randomDay" style="padding:2px 6px;font-size:9px">🎲</button>
      </div>
    </div>
    <div class="poem" id="poem"></div>
    <div class="hint" id="hint"></div>
    <div class="hint" id="personalHint" style="color:#B8860B"></div>
    <div class="grid2" style="margin-top:6px;font-size:10px">
      <span class="k">综合</span><span class="star" id="s0"></span>

  <div class="card">
    <div class="yiji-grid">
      <div class="yiji-col">
        <div class="yiji-row"><span class="badge yi">宜</span><div class="yiji-detail"><span class="yiji-key" id="yi1"></span><span class="yiji-why" id="yi1why"></span></div></div>
        <div class="yiji-row"><span class="badge yi">宜</span><div class="yiji-detail"><span class="yiji-key" id="yi2"></span><span class="yiji-why" id="yi2why"></span></div></div>
        <div class="yiji-row"><span class="badge yi">宜</span><div class="yiji-detail"><span class="yiji-key" id="yi3"></span><span class="yiji-why" id="yi3why"></span></div></div>
      </div>
      <div class="yiji-col">
        <div class="yiji-row"><span class="badge ji">忌</span><div class="yiji-detail"><span class="yiji-key" id="ji1"></span><span class="yiji-why" id="ji1why"></span></div></div>
        <div class="yiji-row"><span class="badge ji">忌</span><div class="yiji-detail"><span class="yiji-key" id="ji2"></span><span class="yiji-why" id="ji2why"></span></div></div>
        <div class="yiji-row"><span class="badge ji">忌</span><div class="yiji-detail"><span class="yiji-key" id="ji3"></span><span class="yiji-why" id="ji3why"></span></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sec">☯️ <span id="gzday"></span></div>

      <span class="k">幸运色</span><span><i class="dot" id="dot"></i><span id="cname"></span></span>
      <span class="k">幸运数字</span><span id="num"></span>
      <span class="k">吉利方位</span><span id="dir"></span>
      <span class="k">贵人星座</span><span id="bene"></span>
    </div>
  </div>

  <div class="card" id="meCard" hidden>
    <div class="sec" id="meTitleRow">
      <span id="meTitle"></span>
      <span id="editInfo">✎ 重新输入</span>
    </div>
    <div id="baziBlock">
      <div class="bodytext" id="baziSummary" style="text-align:center;padding:8px 0;color:#8A7A6A">
        <span id="baziSummaryText">🔒 命盘已隐藏 · </span><span id="showBazi" style="color:#B8860B;cursor:pointer;text-decoration:underline">点击查看</span>

<script>
"use strict";
/* ============================================================
   八字每日运势推断引擎
   基于：十神 / 刑冲合害 / 月令旺衰 / 喜忌用神 / 综合评分
   ============================================================ */

// 天干阴阳：甲丙戊庚壬=阳(1)，乙丁己辛=阴(0)
const STEM_YIN = { "甲":1,"乙":0,"丙":1,"丁":0,"戊":1,"己":0,"庚":1,"辛":0,"壬":1,"癸":0 };
const STEM_YANG = { "甲":0,"乙":1,"丙":0,"丁":1,"戊":0,"己":1,"庚":0,"辛":1,"壬":0,"":1 };

// 五行旺缺分析文案
const EL_STRONG = {
  "木": "仁慈正直，生长向上，但易固执己见",
  "火": "热情外向，行动力强，但易急躁冲动",
  "土": "诚信稳重，值得托付，但易迟缓守旧",
  "金": "果敢刚毅，赏罚分明，但易锋利伤人",
  "水": "聪慧灵动，善于变通，但易多虑不定"
};
const EL_REMEDY = {
  "木": "宜绿色系、木质物件、多接草木、往东方",
  "火": "宜红色系、多晒太阳、下厨做饭、往南方",
  "土": "宜黄棕色系、陶瓷玉石、扎根本地",
  "金": "宜白金色系、佩戴金属饰品、往西方",
  "水": "宜黑蓝色系、多饮水、近水而居、往北方"
};

// 十神：以日主为基准，其他天干与日主的关系
// 返回：十神名称 + 五行属性
function shiShen(dayStem, otherStem) {
  const dayEl = STEM_EL[dayStem];
  const otherEl = STEM_EL[otherStem];
  const dayYin = STEM_YIN[dayStem];  // 1=阳, 0=阴
  const otherYin = STEM_YIN[otherStem];
  const sameYin = dayYin === otherYin;
  
  if (dayEl === otherEl) return sameYin ? "比肩" : "劫财";
  if (SHENG[dayEl] === otherEl) return sameYin ? "食神" : "伤官";
  if (KE[dayEl] === otherEl) return sameYin ? "偏财" : "正财";
  if (KE[otherEl] === dayEl) return sameYin ? "七杀" : "正官";
  if (SHENG[otherEl] === dayEl) return sameYin ? "偏印" : "正印";
  return "未知";
}

// 月令旺衰：日主在月支的状态（简化版：得令/失令）
function monthStrength(dayStem, monthBranch) {
  const dayEl = STEM_EL[dayStem];
  const monthEl = BR_EL[monthBranch];
  // 月支五行与日主五行相同或生我 → 得令
  if (monthEl === dayEl || SHENG[monthEl] === dayEl) return "得令";
  // 我生月支 → 失令（泄气）
  if (SHENG[dayEl] === monthEl) return "失令";
  // 月支克我 → 失令（受压）
  if (KE[monthEl] === dayEl) return "失令";
  // 我克月支 → 得令（掌控）
  return "得令";
}

// 天干五合
const HEAVENLY_COMBINE = {
  "甲己": "土", "乙庚": "金", "丙辛": "水", "丁壬": "木", "戊癸": "火"
};
function heavenlyCombine(s1, s2) {
  const key1 = s1 + s2, key2 = s2 + s1;
  return HEAVENLY_COMBINE[key1] || HEAVENLY_COMBINE[key2] || null;
}

// 天干相冲
const HEAVENLY_CLASH = { "甲庚":1, "乙辛":1, "丙壬":1, "丁":1 };
function heavenlyClash(s1, s2) {
  return HEAVENLY_CLASH[s1+s2] || HEAVENLY_CLASH[s2+s1] || false;
}

// 地支六合
const EARTHLY_COMBINE = {
  "子丑": "土", "寅亥": "木", "卯戌": "火", "辰酉": "金", "巳申": "水", "午未": "火"
};
function earthlyCombine(b1, b2) {
  const key1 = b1 + b2, key2 = b2 + b1;
  return EARTHLY_COMBINE[key1] || EARTHLY_COMBINE[key2] || null;
}

// 地支六冲
const EARTHLY_CLASH = {
  "子午":1, "丑未":1, "寅申":1, "卯酉":1, "辰戌":1, "巳亥":1
};
function earthlyClash(b1, b2) {
  return EARTHLY_CLASH[b1+b2] || EARTHLY_CLASH[b2+b1] || false;
}

// 地支三刑
const EARTHLY_PUNISH = [
  ["寅","巳","申"], ["丑","未","戌"], ["子","卯"]
];
function earthlyPunish(b1, b2) {
  for (const group of EARTHLY_PUNISH) {
    if (group.includes(b1) && group.includes(b2)) return group;
  }
  return null;
}

// 地支六害
const EARTHLY_HARM = {
  "子未":1, "丑午":1, "寅巳":1, "卯辰":1, "申亥":1, "酉戌":1
};
function earthlyHarm(b1, b2) {
  return EARTHLY_HARM[b1+b2] || EARTHLY_HARM[b2+b1] || false;
}

// 综合评分计算
function calcScore(bz, todayGz, mi) {
  let score = 50;  // 基础分
  
  // 1. 今日天干十神（+/- 15 分）
  const todaySS = shiShen(mi.me, todayGz[0]);
  const ssTheme = SHISHEN_THEME[todaySS];
  if (["正印","偏印","食神","正财","偏财","正官"].includes(todaySS)) score += 10;
  if (["七杀","劫财","伤官"].includes(todaySS)) score -= 5;
  
  // 2. 今日地支与日支关系（+/- 15 分）
  const dayBranch = bz.dayGz[1];
  const todayBranch = todayGz[1];
  if (earthlyCombine(dayBranch, todayBranch)) score += 12;
  else if (earthlyClash(dayBranch, todayBranch)) score -= 12;
  else if (earthlyPunish(dayBranch, todayBranch)) score -= 8;
  else if (earthlyHarm(dayBranch, todayBranch)) score -= 6;
  
  // 3. 今日五行喜忌（+/- 20 分）
  const todayEl = STEM_EL[todayGz[0]];
  if (todayEl === mi.xiyong) score += 18;
  else if (SHENG[todayEl] === mi.xiyong) score += 10;
  else if (KE[todayEl] === mi.xiyong) score -= 12;
  else if (todayEl === mi.meEl) score += 5;
  
  // 4. 天干合冲（+/- 10 分）
  if (heavenlyCombine(mi.me, todayGz[0])) score += 8;
  if (heavenlyClash(mi.me, todayGz[0])) score -= 8;
  
  // 5. 月令旺衰调整（+/- 5 分）
  if (monthStrength(mi.me, bz.monthGz[1]) === "得令") score += 3;
  else score -= 3;
  
  return Math.max(20, Math.min(95, score));
}

// 分项评分
function calcSubScores(bz, todayGz, mi, totalScore) {
  const todaySS = shiShen(mi.me, todayGz[0]);
  const todayEl = STEM_EL[todayGz[0]];
  const dayBranch = bz.dayGz[1];
  const todayBranch = todayGz[1];
  
  // 爱情分：看合冲 + 食伤/财星 + 五行（水火主情感，土主平淡）
  let love = totalScore;
  if (earthlyCombine(dayBranch, todayBranch)) love += 8;
  if (earthlyClash(dayBranch, todayBranch)) love -= 10;
  if (["食神","伤官","正财","偏财"].includes(todaySS)) love += 5;
  if (["七杀","偏印"].includes(todaySS)) love -= 5;
  if (todayEl === "水" || todayEl === "火") love += 3;
  if (todayEl === "土") love -= 2;
  
  // 事业分：看官杀/印星 + 月令 + 五行（金土主事业，水主流动）
  let career = totalScore;
  if (["正官","七杀","正印","偏印"].includes(todaySS)) career += 8;
  if (["伤官","劫财"].includes(todaySS)) career -= 5;
  if (monthStrength(mi.me, bz.monthGz[1]) === "得令") career += 5;
  if (todayEl === "金" || todayEl === "土") career += 3;
  if (todayEl === "水") career -= 2;
  
  // 财运分：看财星 + 五行（金主财，水主流动财，木主耗财）
  let wealth = totalScore;
  if (["正财","偏财"].includes(todaySS)) wealth += 10;
  if (["劫财","伤官"].includes(todaySS)) wealth -= 8;
  if (todayEl === "金" && mi.xiyong === "金") wealth += 8;  // 金主财
  if (todayEl === "水") wealth += 2;
  if (todayEl === "木") wealth -= 2;
  
  return {
    love: Math.max(20, Math.min(95, love)),
    career: Math.max(20, Math.min(95, career)),
    wealth: Math.max(20, Math.min(95, wealth))
  };
}

// 生成每日推断
function dailyFortune(bz, todayGz, mi) {
  const todaySS = shiShen(mi.me, todayGz[0]);
  const theme = SHISHEN_THEME[todaySS];
  const totalScore = calcScore(bz, todayGz, mi);
  const sub = calcSubScores(bz, todayGz, mi, totalScore);
  
  // 地支关系断语
  const dayBranch = bz.dayGz[1];
  const todayBranch = todayGz[1];
  let branchDesc = "";
  if (earthlyCombine(dayBranch, todayBranch)) branchDesc = RELATION_DESC["合"];
  else if (earthlyClash(dayBranch, todayBranch)) branchDesc = RELATION_DESC["冲"];
  else if (earthlyPunish(dayBranch, todayBranch)) branchDesc = RELATION_DESC["刑"];
  else if (earthlyHarm(dayBranch, todayBranch)) branchDesc = RELATION_DESC["害"];
  
  // 天干合冲
  let stemDesc = "";
  if (heavenlyCombine(mi.me, todayGz[0])) {
    const combineEl = heavenlyCombine(mi.me, todayGz[0]);
    stemDesc = `今日天干「${todayGz[0]}」与你的日主「${mi.me}」相合化${combineEl}，人缘佳，合作顺利。`;
  } else if (heavenlyClash(mi.me, todayGz[0])) {
    stemDesc = `今日天干「${todayGz[0]}」冲你的日主「${mi.me}」，变动多，宜主动求变。`;
  }
  
  // 综合断语
  const verdict = totalScore >= 75 ? "大吉" : totalScore >= 60 ? "小吉" : totalScore >= 45 ? "平" : totalScore >= 30 ? "小凶" : "大凶";
  
  return {
    score: totalScore,
    love: sub.love,
    career: sub.career,
    wealth: sub.wealth,
    verdict,
    theme: theme.theme,
    desc: theme.desc,
    loveDesc: theme.love,
    careerDesc: theme.career,
    wealthDesc: theme.wealth,
    branchDesc,
    stemDesc,
    shiShen: todaySS
  };
}

const CONTENT_URL = "https://raw.githubusercontent.com/1230963/fortune-assistant/main/content.json";

async function checkContentUpdate() {
  try {
    const localVer = parseInt(localStorage.getItem(CONTENT_VERSION_KEY) || "0", 10);
    const res = await fetch(CONTENT_URL + "?t=" + Date.now());
    const remote = await res.json();
    if (remote.version > localVer) {
      // 更新内容
      if (remote.poems) Object.assign(POEMS, remote.poems);
      if (remote.yiPool) YI_POOL.length = 0, YI_POOL.push(...remote.yiPool);
      if (remote.jiPool) JI_POOL.length = 0, JI_POOL.push(...remote.jiPool);
      if (remote.tips) TIPS.length = 0, TIPS.push(...remote.tips);
      if (remote.bookAnswers) BOOK_ANSWERS.length = 0, BOOK_ANSWERS.push(...remote.bookAnswers);
      localStorage.setItem(CONTENT_VERSION_KEY, remote.version);
      console.log("内容已更新到 v" + remote.version);
      render();  // 重新渲染
    }
  } catch (e) {
    console.log("内容更新检查失败（离线或首次）:", e.message);
  }
}

const APP_VERSION = "1.0.0";
const RELEASE_API = "https://api.github.com/repos/1230963/fortune-assistant/releases/latest";

async function checkAppUpdate() {
  try {
    const res = await fetch(RELEASE_API + "?t=" + Date.now());
    const release = await res.json();
    const latest = release.tag_name || "";
    if (latest && latest !== APP_VERSION && latest > APP_VERSION) {
      showUpdateBanner(latest, release);
    }
  } catch (e) {
    console.log("功能更新检查失败:", e.message);
  }
}

function showUpdateBanner(version, release) {
  const isMac = !IS_WIN;
  const asset = release.assets.find(a =>
    isMac ? a.name.includes("mac") : a.name.includes("windows")
  );
  if (!asset) return;

  const banner = document.createElement("div");
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#B8860B;color:#fff;padding:6px 10px;font-size:11px;text-align:center;z-index:100;cursor:pointer";
  banner.innerHTML = `🎉 新版本 ${version} 可用，点击自动更新`;
  banner.onclick = () => {
    banner.innerHTML = "⏳ 正在下载...";
    banner.style.background = "#8A7A6A";
    banner.style.cursor = "default";
    native({
      action: "autoUpdate",
      url: asset.browser_download_url,
      version: version
    });
  };
  document.body.prepend(banner);
}

const CNY = { 2015:[2,19],2016:[2,8],2017:[1,28],2018:[2,16],2019:[2,5],2020:[1,25],
              2021:[2,12],2022:[2,1],2023:[1,22],2024:[2,10],2025:[1,29],2026:[2,17],

function dayIndex(y, m, d) {  // 距 1949-10-01（甲子日）的天数，日柱精确
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1949, 9, 1)) / 86400000);
}
function gzOfIndex(i) { return STEMS[i % 10] + BRANCHES[i % 12]; }
function yearGzIndex(y, m, d) {  // 春节为界（民间生肖用）
  const c = CNY[y] || [2, 4];
  if (m < c[0] || (m === c[0] && d < c[1])) y -= 1;
  return ((y - 1984) % 60 + 60) % 60;
}

function wuxingToday(date) {
  const now = date || new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  const dayIdx = ((dayIndex(y, m, d) % 60) + 60) % 60;
  const yearIdx = yearGzIndex(y, m, d);
  const dayGz = gzOfIndex(dayIdx), yearGz = gzOfIndex(yearIdx);
  const dayEl = STEM_EL[dayGz[0]];
  const dayNayin = nayinOfIndex(dayIdx);
  const votes = { "木": 0, "火": 0, "土": 0, "金": 0, "水": 0 };
  [STEM_EL[yearGz[0]], BR_EL[yearGz[1]], STEM_EL[dayGz[0]], BR_EL[dayGz[1]],
   dayNayin[dayNayin.length - 1]].forEach((e) => votes[e]++);
  const strong = votes[dayEl] >= 2;
  const shengWo = ELS.find((e) => SHENG[e] === dayEl);
  const xiyong = strong ? SHENG[dayEl] : shengWo;
  const bi = BRANCHES.indexOf(dayGz[1]);
  return { dayGz, yearGz, yearIdx, dayEl, dayNayin, votes, strong, xiyong,
           chongBranch: BRANCHES[(bi + 6) % 12], chongZodiac: ZODIAC[(bi + 6) % 12] };
}

function bazi(y, m, d, hb) {
  // 年柱：以立春（约 2/4）为界
  let ys = y;
  if (m < 2 || (m === 2 && d < 4)) ys = y - 1;
  const yearIdx = ((ys - 1984) % 60 + 60) % 60;
  // 月柱：以节气为界（近似日期）；1 月 1-5 日仍在上一年的子月
  let mBranch = 0;
  for (const [em, ed, br] of JIE) if (m > em || (m === em && d >= ed)) mBranch = br;
  const yinStem = ((yearIdx % 10) % 5 + 1) * 2 % 10;       // 甲己丙寅起、乙庚戊寅起…
  const mStem = (yinStem + (mBranch - 2 + 12) % 12) % 10;
  // 日柱：按甲子日锚点精确推排
  const dayIdx = ((dayIndex(y, m, d) % 60) + 60) % 60;
  // 时柱：甲己日起甲子时；hb 0-11，-1 = 未知
  let hourGz = null;
  if (hb !== null && hb >= 0)
    hourGz = STEMS[(((dayIdx % 10) % 5) * 2 + hb) % 10] + BRANCHES[hb];
  return { yearGz: gzOfIndex(yearIdx),
           monthGz: STEMS[mStem] + BRANCHES[mBranch],
           dayGz: gzOfIndex(dayIdx), hourGz };
}

function mingInfo(bz) {
  const chars = [bz.yearGz, bz.monthGz, bz.dayGz, bz.hourGz].filter(Boolean).join("");
  const votes = { "木": 0, "火": 0, "土": 0, "金": 0, "水": 0 };
  for (const c of chars) votes[STEM_EL[c] || BR_EL[c]]++;
  const me = bz.dayGz[0], meEl = STEM_EL[me];
  const shengWo = ELS.find((e) => SHENG[e] === meEl);
  // 强弱：同我+生我过半为旺；月令得地额外加权
  let power = votes[meEl] + votes[shengWo];
  const monthEl = BR_EL[bz.monthGz[1]];
  if (monthEl === meEl || monthEl === shengWo) power += 1;  // 月令得地
  const strong = power * 2 > chars.length;
  const xiyong = strong ? SHENG[meEl] : shengWo;
  const missing = ELS.filter((e) => votes[e] === 0);
  return { votes, me, meEl, strong, xiyong, missing, count: chars.length };
}

/* ---------------- 确定性随机 ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rint = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
const choice = (rng, arr) => arr[Math.floor(rng() * arr.length)];
function sample(rng, arr, n) {
  const copy = arr.slice(), out = [];
  for (let i = 0; i < n; i++) out.push(copy.splice(Math.floor(rng() * copy.length), 1)[0]);
  return out;
}
function pickLevel(rng) {
  const total = LEVELS.reduce((s, l) => s + l[1], 0);
  let r = rng() * total;
  for (const [name, w] of LEVELS) { r -= w; if (r < 0) return name; }
  return LEVELS[0][0];
}
const CN_DIG = "零一二三四五六七八九";
function cnNum(n) {
  if (n < 10) return CN_DIG[n];
  if (n < 20) return "十" + (n % 10 ? CN_DIG[n % 10] : "");
  const t = Math.floor(n / 10), o = n % 10;
  return CN_DIG[t] + "十" + (o ? CN_DIG[o] : "");
}

    const r = mulberry32(seed);
    const signNo = rint(r, 1, 100);  // 签号 1-100
    const level = ["上上签","上吉","中吉","小吉","平签"][Math.floor((signNo - 1) / 20)];
    const poemIdx = (signNo - 1) % POEMS[level].length;
    return { signNo, level, poem: POEMS[level][poemIdx] };
  }

  const drawn = drawSign(store.birth, store.sign, getViewDateStr(), store.nonce);
  const level = drawn.level;
  $("levelBadge").textContent = `第 ${cnNum(drawn.signNo)} 签 · ${level}`;
  $("poem").textContent = drawn.poem.split("\n")[0].replace(/「|」/g, "");
  native({ action: "level", level: level });
  $("personalHint").textContent = personal
    ? `根据你的八字 · 今日运势 ${personal.fortune.score} 分`
    : "";
  $("hint").textContent = store.nonce ? "今日已求 " + (store.nonce + 1) + " 签（随机）" : "";

  // 星级
  const stars = personal ? personal.stars : (() => {
    const [lo, hi] = STAR_RANGE[level];
    return [0, 1, 2, 3].map(() => rint(rng, lo, hi));
  })();
  for (let i = 0; i < 4; i++) {
    $("s" + i).textContent = "★".repeat(stars[i]) + "☆".repeat(5 - stars[i]);
  }

  // 宜忌（带解释）
  const yiList = personal ? personal.yiList : sample(rng, YI_POOL, 3).map(item => [item, "今日做了能带来好运"]);
  const jiList = personal ? personal.jiList : sample(rng, JI_POOL, 3).map(item => [item, "今日做了容易后悔"]);
  yiList.forEach((pair, i) => {
    $("yi" + (i + 1)).textContent = pair[0];
    $("yi" + (i + 1) + "why").textContent = pair[1];
  });
  jiList.forEach((pair, i) => {
    $("ji" + (i + 1)).textContent = pair[0];
    $("ji" + (i + 1) + "why").textContent = pair[1];
  });

  // 今日五行（精简：干支 + 日主 + 喜用 + 冲煞 + 幸运物）
  $("gzday").textContent = wx.dayGz + "日 · " + wx.yearGz + ZODIAC[wx.yearIdx % 12] + "年";
  $("wxbase").textContent =
    `日主${wx.dayGz[0]}（${wx.dayEl}）· 日元偏${wx.strong ? "旺" : "弱"}`;
  const xiColor = personal ? personal.luckyColor : choice(rng, EL_COLORS[wx.xiyong]);
  const xiDir = personal ? personal.luckyDir : choice(rng, EL_DIR[wx.xiyong]);
  $("wxxiyong").textContent = personal
    ? `你的喜用神「${personal.mi.xiyong}」：宜${xiColor[0]}色系，吉位${xiDir}。`
    : `喜用五行「${wx.xiyong}」：宜${xiColor[0]}色系，吉位${xiDir}。`;

  let myZodiac = null;
  if (birth) myZodiac = ZODIAC[yearGzIndex(birth.y, birth.m, birth.d) % 12];
  if (myZodiac && myZodiac === wx.chongZodiac) {
    $("wxchong").textContent = `⚠️ 今日冲你的生肖（${wx.chongZodiac}），大事缓行。`;
    $("wxchong").style.fontWeight = "700";
  } else {
    $("wxchong").textContent = `冲${wx.chongZodiac}（${wx.chongBranch}）· 属${wx.chongZodiac}的朋友宜低调。`;
    $("wxchong").style.fontWeight = "400";
  }

  // 幸运物：personal 里已按独立种子算好，直接用
  $("dot").style.background = xiColor[1];
  $("cname").textContent = xiColor[0];
  $("num").textContent = personal ? personal.luckyNum : rint(rng, 1, 99);
  $("dir").textContent = xiDir;
  $("bene").textContent = personal ? personal.luckySign : choice(rng, SIGNS);

  // 命盘 / 星座
  const meCard = $("meCard");
  if (birth || sign) {
    meCard.hidden = false;
    $("meTitle").textContent =
      birth && sign ? "🧧 我的命盘 · 星座" : (birth ? "🧧 我的命盘" : "♈ 星座运势");

    if (birth) {
      $("baziBlock").hidden = false;
      const bz = bazi(birth.y, birth.m, birth.d, birth.h);
      const mi = mingInfo(bz);
      const now = getViewDate();
      const todayGz = gzOfIndex(((dayIndex(now.getFullYear(), now.getMonth()+1, now.getDate()) % 60) + 60) % 60);
      const fortune = dailyFortune(bz, todayGz, mi);

      // 命盘详情：隐藏状态持久化，点「查看/隐藏」双向切换
      function applyBaziHidden() {
        $("baziDetail").hidden = store.baziHidden;
        $("baziSummaryText").textContent = store.baziHidden ? "🔒 命盘已隐藏 · " : "🔓 命盘已显示 · ";
        $("showBazi").textContent = store.baziHidden ? "点击查看" : "点击隐藏";
      }
      $("showBazi").onclick = () => {
        store.baziHidden = !store.baziHidden;
        applyBaziHidden();
        fit();
      };
      applyBaziHidden();

      // 预填充命盘数据（隐藏状态也先算好）
      $("glLine").textContent = `公历 ${birth.y}年${birth.m}月${birth.d}日` +
        (birth.h >= 0 ? " " + HOURS[birth.h].replace(" ", " · ") : "（时辰未知）");
      const ln = solarToLunar(birth.y, birth.m, birth.d);
      const lnGz = gzOfIndex((((ln.year - 1984) % 60) + 60) % 60);
      $("nlLine").textContent = `农历 ${lnGz}年${ln.isLeap ? "闰" : ""}` +
        `${LUNAR_MONTHS[ln.month - 1]}${lunarDayName(ln.day)}` +
        (bz.hourGz ? ` ${bz.hourGz[1]}时` : "") +
        `　${ZODIAC_EMOJI[myZodiac]} 属${myZodiac}`;

      const pill = $("pillars");
      pill.innerHTML = "";
      [
        { label: "年柱", gz: bz.yearGz },
        { label: "月柱", gz: bz.monthGz },
        { label: "日柱", gz: bz.dayGz, master: true },
        { label: "时柱", gz: bz.hourGz }
      ].forEach((p) => {
        const cell = document.createElement("div");
        cell.className = "pcell";
        if (p.gz) {
          const s = p.gz[0], b = p.gz[1];
          const ss = p.master ? "日主" : shiShen(mi.me, s);
          cell.innerHTML =
            `<div class="ph">${p.label}</div>` +
            `<div class="pg" style="color:${EL_BAR[STEM_EL[s]]}">${s}</div>` +
            `<div class="pe">${STEM_EL[s]}·${ss}</div>` +
            `<div style="height:3px"></div>` +
            `<div class="pg" style="color:${EL_BAR[BR_EL[b]]}">${b}</div>` +
            `<div class="pe">${BR_EL[b]}</div>`;
        } else {
          cell.innerHTML = `<div class="ph">${p.label}</div>` +
            `<div class="pg" style="color:#B0A48E">?</div>` +
            `<div class="pe">时辰未知</div>`;
        }
        pill.appendChild(cell);
      });

      $("myWx").innerHTML =
        "五行统计：" +
        ELS.map((e) => `<span style="color:${EL_BAR[e]};font-weight:700">${e}</span> ${mi.votes[e]}`).join("　") +
        (mi.missing.length ? ` · <span style="color:#C62828">缺${mi.missing.join("、")}</span>` : " · 五行俱全") +
        (bz.hourGz ? "" : '<span style="color:#8A7A6A">（按六字计）</span>');

      $("myXiyong").textContent =
        `日主偏${mi.strong ? "旺" : "弱"}，喜用神「${mi.xiyong}」`;

      $("dailyTheme").textContent = `今日「${fortune.theme}」· ${fortune.verdict} ${fortune.score}分`;
      $("ds0").style.width = fortune.score + "%";
      $("dv0").textContent = fortune.score;
      $("ds1").style.width = fortune.love + "%";
      $("dv1").textContent = fortune.love;
      $("ds2").style.width = fortune.career + "%";
      $("dv2").textContent = fortune.career;
      $("ds3").style.width = fortune.wealth + "%";
      $("dv3").textContent = fortune.wealth;
    } else {
      $("baziBlock").hidden = true;
    }

    if (sign) {
      $("signScoreCol").style.display = "";
      $("signTitle").textContent = `♈ ${sign} · ${SIGN_XIANG[SIGN_EL[sign]]}`;
      for (let i = 0; i < 3; i++) {
        const p = rint(rng, 35, 99);
        $("p" + i).style.width = p + "%";
        $("v" + i).textContent = p;
      }
    } else {
      $("signScoreCol").style.display = "none";
    }
  } else {
    meCard.hidden = true;
  }

  // 主按钮
  $("signBtn").textContent = " " + (sign || (myZodiac ? "属" + myZodiac : "未设置")) + " ▾ ";

  // 同步日期给 native（macOS 标题栏）
  const now = getViewDate();
  const wd = "日一二三四五六"[now.getDay()];
  native({ action: "setDate", date: `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${wd} · ${wx.yearGz}${ZODIAC[wx.yearIdx % 12]}年 · ${wx.dayGz}日` });

  updateWinDate();
  fit();
}

function fit() {
  requestAnimationFrame(() =>
    setTimeout(() => native({ action: "fit", height: document.body.scrollHeight }), 30));
}

/* ---------------- 设置面板 ---------------- */
$("reroll").onclick = () => { store.nonce = store.nonce + 1; render(); };

const overlay = $("meOverlay");
const signsBox = $("signs");
let tmpSign = null, tmpY = null, tmpM = 1, tmpD = 1, tmpH = -1;

SIGNS.forEach((s) => {
  const b = document.createElement("button");
  b.textContent = s;
  b.onclick = () => { tmpSign = (tmpSign === s) ? null : s; refreshPanel(); };
  signsBox.appendChild(b);
});
// 初始化下拉选项
(function initSelects() {
  const curYear = new Date().getFullYear();
  const ySel = $("ySel"), mSel = $("mSel"), dSel = $("dSel"), hSel = $("hSel");
  for (let y = curYear; y >= 1930; y--) {
    const o = document.createElement("option");
    o.value = y; o.textContent = y + " 年";
    ySel.appendChild(o);
  }
  for (let m = 1; m <= 12; m++) {
    const o = document.createElement("option");
    o.value = m; o.textContent = m + " 月";
    mSel.appendChild(o);
  }
  for (let d = 1; d <= 31; d++) {
    const o = document.createElement("option");
    o.value = d; o.textContent = d + " 日";
    dSel.appendChild(o);
  }
  const hNone = document.createElement("option");
  hNone.value = -1; hNone.textContent = "未知";
  hSel.appendChild(hNone);
  HOURS.forEach((h, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = h;
    hSel.appendChild(o);
  });

  ySel.onchange = () => { tmpY = ySel.value ? parseInt(ySel.value, 10) : null; clampDayOptions(); };
  mSel.onchange = () => { tmpM = parseInt(mSel.value, 10); clampDayOptions(); };
  dSel.onchange = () => { tmpD = parseInt(dSel.value, 10); };
  hSel.onchange = () => { tmpH = parseInt(hSel.value, 10); };
})();

function clampDayOptions() {
  if (tmpY === null) return;
  const max = new Date(tmpY, tmpM, 0).getDate();
  if (tmpD > max) tmpD = max;
  $("dSel").value = tmpD;
}
function refreshPanel() {
  signsBox.querySelectorAll("button").forEach((b) =>
    b.classList.toggle("on", b.textContent === tmpSign));
  $("ySel").value = tmpY === null ? "" : tmpY;
  $("mSel").value = tmpM;
  $("dSel").value = tmpD;
  $("hSel").value = tmpH;
}
$("meClear").onclick = () => { tmpSign = null; tmpY = null; tmpH = -1; refreshPanel(); };
$("meCancel").onclick = () => { overlay.hidden = true; };
$("meOk").onclick = () => {
  store.sign = tmpSign;
  store.birth = tmpY === null ? null : { y: tmpY, m: tmpM, d: tmpD, h: tmpH };
  overlay.hidden = true;
  render();
};
function openPanel(onboarding) {
  tmpSign = store.sign;
  const b = store.birth;
  if (b) { tmpY = b.y; tmpM = b.m; tmpD = b.d; tmpH = b.h; }
  else { tmpY = null; tmpM = 1; tmpD = 1; tmpH = -1; }
  $("panelTitle").textContent = onboarding
    ? "✨ 先输入你的生辰八字，解锁专属运势" : "✨ 修改你的信息";
  refreshPanel();
  overlay.hidden = false;
  native({ action: "expand" });  // 若处于小球状态，先展开面板
}
$("signBtn").onclick = () => openPanel();
$("editInfo").onclick = () => openPanel();

/* ---------------- 右键菜单 ---------------- */
const menu = $("menu");
function showMenu(x, y) {
  menu.hidden = false;
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.max(4, Math.min(x, 320 - mw - 4)) + "px";
  menu.style.top = Math.max(4, Math.min(y, window.innerHeight - mh - 4)) + "px";
}
window.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  if (!overlay.hidden) return;
  showMenu(e.clientX, e.clientY);
});
document.addEventListener("mousedown", (e) => {
  if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { menu.hidden = true; overlay.hidden = true; }
});
menu.addEventListener("click", (e) => {
  const item = e.target.closest(".mi");
  if (!item) return;
  menu.hidden = true;
  switch (item.dataset.act) {
    case "reroll": store.nonce = store.nonce + 1; render(); break;
    case "sign": openPanel(); break;
    case "autostart":
      autostartOn = !autostartOn;
      native({ action: "setAutostart", on: autostartOn });
      $("asCheck").style.visibility = autostartOn ? "visible" : "hidden";
      break;
    case "quit": native({ action: "quit" }); break;
  }
});

/* ---------------- 跨天自动刷新 ---------------- */
let curDate = todayStr();
setInterval(() => {
  if (todayStr() !== curDate) { curDate = todayStr(); render(); }
}, 30000);

// Windows/Electron 平台：显示 HTML 标题栏
const IS_WIN = location.search.indexOf("win=1") >= 0;
if (IS_WIN) document.body.classList.add("win");

// 小球模式由 main.js 通过 app-event 控制（不用 resize 监听，避免冲突）

$("whMin").onclick = () => native({ action: "minimize" });
$("whClose").onclick = () => native({ action: "quit" });
$("ball").ondblclick = () => native({ action: "expand" });

/* ---------------- 答案之书逻辑 ---------------- */
function bookShow(page) {
  page = Math.max(1, Math.min(600, parseInt(page, 10) || 1));
  $("bookPage").value = page;
  // 哈希映射：同一页码永远同一答案
  const idx = (page * 73 + 13) % BOOK_ANSWERS.length;
  $("bookAnswer").textContent = "「" + BOOK_ANSWERS[idx] + "」";
  $("bookPageLabel").textContent = "—— 第 " + page + " 页 ——";
}
let bookComposing = false;
$("bookPage").addEventListener("compositionstart", () => { bookComposing = true; });
$("bookPage").addEventListener("compositionend", () => { bookComposing = false; bookShow($("bookPage").value); });
$("bookPage").onchange = () => bookShow($("bookPage").value);
$("bookPage").oninput = () => {
  if (bookComposing) return;  // 中文输入法组合中不处理
  let v = $("bookPage").value.replace(/\D/g, "");
  if (v) {
    v = Math.max(1, Math.min(600, parseInt(v, 10)));
    $("bookPage").value = v;
    bookShow(v);
  }
};
$("bookPage").onkeydown = (e) => {
  if (e.key === "ArrowUp") { e.preventDefault(); bookShow(parseInt($("bookPage").value, 10) + 1); }
  if (e.key === "ArrowDown") { e.preventDefault(); bookShow(parseInt($("bookPage").value, 10) - 1); }
};
$("bookPrev").onclick = () => bookShow(parseInt($("bookPage").value, 10) - 1);
$("bookNext").onclick = () => bookShow(parseInt($("bookPage").value, 10) + 1);
$("bookRandom").onclick = () => bookShow(Math.floor(Math.random() * 600) + 1);
bookShow(123);

// 日期选择器：未来 30 天任意一天 + 随机
(function initDatePicker() {
  const picker = $("datePicker");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  picker.valueAsDate = today;
  picker.min = today.toISOString().split("T")[0];
  const maxDate = new Date(today);
  maxDate.setDate(maxDate.getDate() + 30);
  picker.max = maxDate.toISOString().split("T")[0];

  picker.onchange = () => {
    const selected = picker.valueAsDate;
    if (!selected) return;
    const t = new Date();
    t.setHours(0, 0, 0, 0);
    selected.setHours(0, 0, 0, 0);
    viewDateOffset = Math.round((selected - t) / 86400000);
    render();
  };
})();

// 随机选未来 30 天中的一天
$("randomDay").onclick = () => {
  const offset = Math.floor(Math.random() * 31);
  const d = new Date();
  d.setDate(d.getDate() + offset);
  $("datePicker").valueAsDate = d;
  $("datePicker").onchange();
};

render();

// 更新标题栏日期（Windows 版，每次 render 都更新，跨天自动刷新）
function updateWinDate() {
  if (!IS_WIN) return;
  const d = new Date();
  const wd = "日一二三四五六"[d.getDay()];
  const wx2 = wuxingToday();
  $("whDate").textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${wd} · ${wx2.yearGz}年 · ${wx2.dayGz}日`;
}
updateWinDate();

// 小球圆点颜色
const LEVEL_DOT = { "上上签": "#D4AF37", "上吉": "#E67E22", "中吉": "#52BE80", "小吉": "#5DADE2", "平签": "#95A5A6" };
$("ballDot").style.background = LEVEL_DOT[$("levelBadge").textContent] || "#95A5A6";

// 首次启动：未设置任何信息时，主动弹出生辰输入面板
if (!store.sign && !store.birth) {
  openPanel(true);
}
</script>
</body>
</html>
